name: Test and deploy StockWise

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockwise-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      render_configured: ${{ steps.deployment-secrets.outputs.render_configured }}
      vercel_configured: ${{ steps.deployment-secrets.outputs.vercel_configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check deployment secrets
        id: deployment-secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "render_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "render_configured=false" >> "$GITHUB_OUTPUT"
            echo "Render deploy skipped: configure RENDER_DEPLOY_HOOK_URL in repository Actions secrets."
          fi

          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "vercel_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy skipped: configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repository Actions secrets."
          fi

  deploy-backend:
    name: Deploy API to Render
    needs: validate
    if: needs.validate.outputs.render_configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: validate
    if: needs.validate.outputs.vercel_configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link Vercel project
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing GitHub secrets: VERCEL_ORG_ID and/or VERCEL_PROJECT_ID"
            exit 1
          fi
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID}))"

      - name: Pull Vercel production settings
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing GitHub secret: VERCEL_TOKEN"
            exit 1
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publish to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
